<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Sweetest Boy 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Segoe UI", cursive;

      background:
        radial-gradient(circle at 20% 20%, #ffd6e7, transparent 30%),
        radial-gradient(circle at 80% 80%, #ffc1d9, transparent 30%),
        linear-gradient(135deg, #ffb6d5, #ffe1ec, #ffc7dc);
    }

    .container {
      width: 90%;
      max-width: 750px;
      padding: 30px;

      text-align: center;

      background: rgba(255, 255, 255, 0.38);
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 30px;

      backdrop-filter: blur(12px);

      box-shadow: 0 20px 50px rgba(180, 40, 90, 0.2);

      z-index: 10;
    }

    h1 {
      color: #b51655;
      font-size: 42px;
      margin: 0 0 20px;
      text-shadow: 2px 2px 8px rgba(150, 30, 75, 0.15);
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;

      border: 4px solid rgba(255,255,255,0.7);
      border-radius: 22px;

      box-shadow: 0 10px 30px rgba(150,30,80,0.25);

      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    p {
      color: #96345c;
      font-size: 18px;
      margin: 20px 0 0;
    }

    /* Floating hearts */

    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 28px;
      animation: float 8s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
      }
    }

    .heart:nth-child(1) {
      left: 8%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 25%;
      animation-delay: 2s;
    }

    .heart:nth-child(3) {
      left: 50%;
      animation-delay: 4s;
    }

    .heart:nth-child(4) {
      left: 75%;
      animation-delay: 1s;
    }

    .heart:nth-child(5) {
      left: 92%;
      animation-delay: 3s;
    }

  </style>
</head>

<body>

  <!-- Floating hearts -->
  <div class="heart">💗</div>
  <div class="heart">💕</div>
  <div class="heart">💖</div>
